version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smart_canteen_db
    environment:
      POSTGRES_USER: canteen_user
      POSTGRES_PASSWORD: canteen_secret_password
      POSTGRES_DB: smart_canteen_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canteen_user -d smart_canteen_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: smart_canteen_backend
    environment:
      DATABASE_URL: postgresql+psycopg://canteen_user:canteen_secret_password@db:5432/smart_canteen_db
      SECRET_KEY: super_secret_production_jwt_key_2026
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: smart_canteen_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
